<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f5f1e9"><title>Nap Sprint · Sample App</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;padding:22px;background:#f5f1e9;color:#24322b;font-family:system-ui,-apple-system,sans-serif}.card{width:min(100%,430px);padding:clamp(23px,7vw,42px);border:1px solid #cfcbbb;border-radius:8px;background:#fbf9f3;box-shadow:9px 10px 0 #d9d3c3}.kicker{font:11px ui-monospace,monospace;letter-spacing:.1em;color:#73766c}.sample{float:right;color:#c2553e}.title{margin:24px 0 0;font-size:clamp(36px,10vw,52px);line-height:1;letter-spacing:-.07em}.desc{color:#73766c;line-height:1.5}.timer{margin:30px 0 24px;font-size:clamp(70px,19vw,100px);font-weight:650;line-height:1;letter-spacing:-.09em;font-variant-numeric:tabular-nums}.timer span{color:#f36c4b}.actions{display:flex;gap:10px}.actions button{flex:1;min-height:48px;border:0;border-radius:4px;background:#24322b;color:#fff9ed;font:600 13px system-ui;cursor:pointer}.actions button.secondary{background:#e8e3d8;color:#24322b}.back{display:inline-block;margin-top:24px;color:#666b60;font:11px ui-monospace,monospace;text-decoration:none}.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
  </style>
</head>
<body><main class="card"><div class="kicker">NAP TIME BUILDS <span class="sample">SAMPLE APP</span></div><h1 class="title">Nap Sprint</h1><p class="desc">A little focus timer for a little pocket of quiet.</p><div id="timer" class="timer" role="timer" aria-live="off">15<span>:</span>00</div><div class="actions"><button id="toggle" type="button">Start sprint</button><button id="reset" class="secondary" type="button">Reset</button></div><a id="back" class="back" href="/">← Back to the build list</a><p id="status" class="sr" aria-live="polite"></p></main><script>
    const base = location.pathname.startsWith('/nap-time-builds/') ? '/nap-time-builds/' : '/';
    document.querySelector('#back').href = base;
    let seconds = 15 * 60, interval = null;
    const display = document.querySelector('#timer'), toggle = document.querySelector('#toggle'), status = document.querySelector('#status');
    function paint(){const m=String(Math.floor(seconds/60)).padStart(2,'0'),s=String(seconds%60).padStart(2,'0');display.innerHTML=`${m}<span>:</span>${s}`;}
    toggle.addEventListener('click',()=>{if(interval){clearInterval(interval);interval=null;toggle.textContent='Resume sprint';status.textContent='Sprint paused.';return;}if(seconds===0){seconds=15*60;paint();}toggle.textContent='Pause sprint';status.textContent='Sprint started.';interval=setInterval(()=>{seconds=Math.max(0,seconds-1);paint();if(seconds===0){clearInterval(interval);interval=null;toggle.textContent='Start again';status.textContent='Sprint complete. Nice work.';}},1000);});
    document.querySelector('#reset').addEventListener('click',()=>{clearInterval(interval);interval=null;seconds=15*60;paint();toggle.textContent='Start sprint';status.textContent='Timer reset.';});
    paint();
  </script></body></html>
